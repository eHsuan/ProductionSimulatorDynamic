; ==============================================================================
; 03SEC & 01SG 全線多站點動態混線模擬器設定檔 (Production Simulator Config)
; 本檔案支援直接以文字編輯器 (如記事本 Notepad) 修改，儲存後重新執行模擬即生效
; ==============================================================================

[SIMULATION]
; 模擬模式:
;   dynamic = 動態模擬 (先播放即時 WIP 水平柱狀動畫，關閉後產出總結圖與分析折線圖)
;   static  = 靜態模擬 (跳過動畫播放，直接完成模擬並產出總結圖與分析折線圖)
sim_mode = static

; 每日全線投入 Lot 總數 (建議範圍：10 ~ 35 Lots/天)
daily_lots = 29

; 雙產品混線比例 (03SEC : 01SG)
; 例如：7:3 (70% 03SEC + 30% 01SG), 5:5, 8:2, 1:0 (純 03SEC), 0:1 (純 01SG)
mix_ratio = 7:3

; 每天全線設備實際排班工時 (小時/天，例如 20.0 代表每天排 20 小時)
work_hours = 20.0

; 設備實際正常運轉率 RUN% (百分比，例如 83.0 代表 83%，扣除保養/換線損失)
; 每天設備實際生產時間 = 60 × work_hours × (RUN% / 100) (例如 60 × 20 × 0.83 = 996 分鐘/天/台)
run_pct = 83.0

; 站與站之間人員推車跨站搬送時間 (分鐘/次，設為 0 代表不計搬送時間)
transfer_min = 8.0

; 瓶頸排行榜顯示前 N 名 (Top N，例如 3 或 5)
top_n = 3

; 正式模擬時間長度 (分鐘，預設 7 天 = 10080 分鐘)
sim_duration = 10080

; 產線預熱時間 (分鐘，預設 7 天 = 10080 分鐘，確保 Day 1, 00:00 啟動時產線已有健康常態 WIP)
warmup_duration = 10080

; WIP / 排隊隊列警戒門檻數 (超過此數量時柱狀圖轉紅色警示，且折線圖在此處畫紅色虛線)
alert_threshold = 20
